<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Level textures — visual check</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    body { margin: 0; background: #14161a; color: #e8e8e8; font: 13px/1.5 Consolas, Menlo, monospace; padding: 12px; }
    #level-label { font-size: 20px; font-weight: bold; color: #ffd24d; }
    #status { color: #9fd0ff; margin-top: 4px; }
    #errors { color: #ff7f7f; font-weight: bold; margin-top: 6px; white-space: pre-wrap; }
    #view { display: block; width: 800px; height: 450px; border: 1px solid #444; margin-top: 10px; }
  </style>
</head>
<body>
  <div id="level-label">starting…</div>
  <div id="status"></div>
  <div id="errors"></div>
  <canvas id="view" width="800" height="450"></canvas>
  <script type="module" src="./test-textures.js"></script>

</html>
