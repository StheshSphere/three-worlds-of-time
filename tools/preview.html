<!DOCTYPE html>
<!-- Dev-only model viewer (not part of the deployed game).
     Serve the repo root (python3 -m http.server) and open
     http://localhost:8000/tools/preview.html?m=models/hero/time-traveller.glb&clip=Idle -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Model preview</title>
  <style>html, body { margin: 0; height: 100%; background: #222; overflow: hidden; } #info { position: fixed; top: 6px; left: 8px; color: #ddd; font: 12px monospace; }</style>
  <script type="importmap">{ "imports": { "three": "../libs/three/three.module.js", "three/addons/": "../libs/three/addons/" } }</script>
</head>
<body>
  <div id="info"></div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    const q = new URLSearchParams(location.search);
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x3a3d46);
    scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
    const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(3, 5, 4); scene.add(sun);
    const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 100);
    const gltf = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync('../assets/' + q.get('m'));
    scene.add(gltf.scene);
    const box = new THREE.Box3().setFromObject(gltf.scene);
    const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
    const r = Math.max(size.x, size.y, size.z);
    const yaw = Number(q.get('yaw') || 0.5);
    camera.position.set(c.x + Math.sin(yaw) * r * 3.2, c.y + r * 0.35, c.z + Math.cos(yaw) * r * 3.2);
    camera.lookAt(c);
    let mixer = null;
    if (gltf.animations.length) {
      mixer = new THREE.AnimationMixer(gltf.scene);
      const clip = THREE.AnimationClip.findByName(gltf.animations, q.get('clip') || 'Idle') || gltf.animations[0];
      mixer.clipAction(clip).play();
      mixer.update(Number(q.get('t') || 0.3));
    }
    document.getElementById('info').textContent = `size ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)}  clips: ${gltf.animations.map((a) => a.name).join(', ')}`;
    renderer.render(scene, camera);
    window.__ready = true;
  </script>
</body>
</html>
